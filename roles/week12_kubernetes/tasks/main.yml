---
- name: Create K3s and lab directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/lib/rancher/k3s/server/manifests
    - /etc/rancher/k3s
    - "{{ lab12_dir }}"
    - /data/nfs/inventory
  tags: week12_kubernetes

- name: Set permissions for inventory NFS directory
  ansible.builtin.file:
    path: /data/nfs/inventory
    state: directory
    owner: root
    group: root
    mode: "0777"
  tags: week12_kubernetes

- name: Remove duplicate Traefik .yaml config if present
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
    state: absent
  tags: week12_kubernetes

- name: Deploy Traefik K3s config
  ansible.builtin.template:
    src: traefik-config.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
    mode: "0644"
  tags: week12_kubernetes

- name: Remove duplicate Traefik .yml config if present
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests/traefik-config.yml
    state: absent
  tags: week12_kubernetes

- name: Deploy K3s config
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  tags: week12_kubernetes

- name: Check whether K3s is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary
  tags: week12_kubernetes

- name: Install K3s
  ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
  args:
    executable: /bin/bash
  when: not k3s_binary.stat.exists
  tags: week12_kubernetes

- name: Ensure K3s is running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
  tags: week12_kubernetes

- name: Wait for Kubernetes API
  ansible.builtin.command: /usr/local/bin/kubectl get nodes
  register: kubectl_nodes
  retries: 20
  delay: 5
  until: kubectl_nodes.rc == 0
  changed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tags: week12_kubernetes

- name: Open Kubernetes API port
  ansible.posix.firewalld:
    port: "{{ k3s_api_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  tags: week12_kubernetes

- name: Trust K3s internal networks
  ansible.posix.firewalld:
    source: "{{ item }}"
    zone: trusted
    permanent: true
    immediate: true
    state: enabled
  loop:
    - "{{ k3s_pod_cidr }}"
    - "{{ k3s_service_cidr }}"
  tags: week12_kubernetes

- name: Deploy inventory Kubernetes manifest
  ansible.builtin.template:
    src: inventory-api.yaml.j2
    dest: "{{ lab12_dir }}/inventory-api.yaml"
    owner: centos
    group: centos
    mode: "0644"
  tags: week12_kubernetes

- name: Deploy website Kubernetes manifest
  ansible.builtin.template:
    src: website.yaml.j2
    dest: "{{ lab12_dir }}/website.yaml"
    owner: centos
    group: centos
    mode: "0644"
  tags: week12_kubernetes

- name: Apply inventory manifest
  ansible.builtin.command: /usr/local/bin/kubectl apply -f "{{ lab12_dir }}/inventory-api.yaml"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tags: week12_kubernetes

- name: Apply website manifest
  ansible.builtin.command: /usr/local/bin/kubectl apply -f "{{ lab12_dir }}/website.yaml"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tags: week12_kubernetes

- name: Wait for inventory deployment
  ansible.builtin.command: /usr/local/bin/kubectl rollout status deployment/inventory-api -n lab12 --timeout=180s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  tags: week12_kubernetes

- name: Wait for website deployment
  ansible.builtin.command: /usr/local/bin/kubectl rollout status deployment/website -n lab12 --timeout=180s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  tags: week12_kubernetes

- name: Backup inventory Apache config
  ansible.builtin.copy:
    src: "{{ inventory_apache_conf }}"
    dest: "{{ inventory_apache_conf }}.bak-week12"
    remote_src: true
    force: false
  tags: week12_kubernetes

- name: Deploy inventory Apache proxy to Kubernetes
  ansible.builtin.template:
    src: inventory-apache.conf.j2
    dest: "{{ inventory_apache_conf }}"
    owner: root
    group: root
    mode: "0644"
  tags: week12_kubernetes

- name: Backup frontpage Apache config
  ansible.builtin.copy:
    src: "{{ frontpage_apache_conf }}"
    dest: "{{ frontpage_apache_conf }}.bak-week12"
    remote_src: true
    force: false
  tags: week12_kubernetes

- name: Deploy frontpage Apache proxy to Kubernetes
  ansible.builtin.template:
    src: frontpage-apache-k8s.conf.j2
    dest: "{{ frontpage_apache_conf }}"
    owner: root
    group: root
    mode: "0644"
  tags: week12_kubernetes

- name: Test Apache config
  ansible.builtin.command: apachectl configtest
  changed_when: false
  tags: week12_kubernetes

- name: Reload Apache
  ansible.builtin.systemd:
    name: httpd
    state: reloaded
  tags: week12_kubernetes
